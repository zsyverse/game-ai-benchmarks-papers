name: Suggest a game-generation paper / 推荐游戏生成论文
description: Propose a direct generation method paper or a formal generation benchmark paper
title: "[Paper]: "
labels: [resource]
body:
  - type: dropdown
    id: role
    attributes:
      label: Paper role / 论文角色
      options:
        - Generation method paper / 生成方法论文
        - Generation benchmark paper / 生成 Benchmark 论文
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Generated output / 生成产物
      options:
        - Complete runnable game / 完整可运行游戏
        - Executable code or engine project / 可执行代码或引擎工程
        - Executable rules or mechanics / 可执行规则或机制
        - Playable level, map, task, or chart / 可玩关卡、地图、任务或谱面
        - Player-controllable generated game world / 玩家可控制的生成式游戏世界
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Canonical paper title / 论文正式标题
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary paper URL / 论文一手来源链接
      description: Proceedings, DOI, arXiv, or OpenReview; a project page alone is insufficient.
    validations:
      required: true
  - type: textarea
    id: generation_evidence
    attributes:
      label: Direct-generation evidence / 直接生成依据
      description: Cite the primary-source passage showing that generation is the paper's central contribution.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Task and evaluation / 任务与评测
      description: For a benchmark, include the generation task, protocol, metrics, and empirical generator experiments.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Official artifacts / 官方工件
      description: Add official code, data, models, demos, and verified availability if they exist.
  - type: dropdown
    id: availability
    attributes:
      label: Verified artifact availability / 已核验工件可用性
      options:
        - Open / 核心工件已公开
        - Partial / 仅部分工件公开
        - Closed / 未核验到可运行核心发布
    validations:
      required: true
  - type: checkboxes
    id: scope_check
    attributes:
      label: Scope and duplicate check / 范围与查重确认
      options:
        - label: The generated artifact—not agent playing performance—is the paper's central research object. / 论文核心研究对象是生成工件，而非智能体游玩表现。
          required: true
        - label: This is not dataset-only, framework-only, an existing-repository coding benchmark, standalone repair/balancing, a non-playable scene/reskin, isolated asset/narrative generation, or an NPC/player-agent paper. / 本论文不是纯数据集、纯框架、既有仓库 coding benchmark、独立修复/平衡、不可玩场景/换皮、孤立资产/叙事生成或 NPC/玩家智能体论文。
          required: true
        - label: I searched all three public categories and found no canonical record for this paper or version family. / 我已搜索三个公开分类，未发现该论文或版本族的 canonical 记录。
          required: true
        - label: I checked the paper itself rather than relying on a blog, list, or repository name. / 我已核对论文本身，而非只依据博客、榜单或仓库名称。
          required: true
