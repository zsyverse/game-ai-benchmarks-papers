name: Suggest a game-generation resource / 推荐游戏生成资源
description: Propose a paper, benchmark, dataset, or tool that generates games
title: "[Resource]: "
labels: [resource]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Generation scope / 生成范围
      options:
        - Complete game / 完整游戏
        - Code or engine project / 代码或引擎工程
        - Rules or mechanics / 规则或机制
        - Level or playable content / 关卡或可玩内容
        - Interactive world model / 交互世界模型
        - Survey or taxonomy / 综述或分类
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Resource type / 资源类型
      options:
        - Benchmark / 基准
        - Environment / 环境
        - Dataset / 数据集
        - Paper / 论文
        - Tool / 工具
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Entry role / 条目角色
      options:
        - Core generator / 核心生成器
        - Generation benchmark, dataset, or evaluator / 生成专用 benchmark、数据集或评测器
        - Boundary, infrastructure, or field framing / 边界、基础设施或领域框架
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Canonical title / 正式标题
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary-source URL / 一手来源链接
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Task, metrics, and evidence / 任务、指标与依据
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Code and data links / 代码与数据链接
  - type: dropdown
    id: availability
    attributes:
      label: Verified artifact availability / 已核验工件可用性
      options:
        - Open / 核心工件已公开
        - Partial / 仅部分工件公开
        - Closed / 未核验到可复现发布
        - Paper-only by design / 有意仅提供论文
    validations:
      required: true
  - type: checkboxes
    id: scope_check
    attributes:
      label: Scope check / 范围确认
      options:
        - label: This work generates a game or playable content; it is not primarily a game-playing agent paper. / 本工作生成游戏或可玩内容，不是以玩游戏为主的智能体论文。
          required: true
        - label: I checked the paper or official project rather than relying only on a blog, list, or repository name. / 我已核对论文或官方项目，而非只依据博客、榜单或仓库名称。
          required: true
