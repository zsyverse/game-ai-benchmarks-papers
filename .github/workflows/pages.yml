name: Deploy paper index UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build full paper card dataset
        run: python3 scripts/build_site_papers.py
      - name: Prepare Pages artifact
        run: |
          mkdir -p page-root
          cp -R site/. page-root/
          cp -R docs page-root/docs
          cp README.md README.zh-CN.md CONTRIBUTING.md SCOPE.md page-root/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./page-root
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
