name: Validate bibliography

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bilingual index
        run: python scripts/validate_index.py

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
