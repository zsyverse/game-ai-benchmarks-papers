name: Validate bibliography

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate bilingual index
        run: python scripts/validate_index.py

      - name: Test index search
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check generated paper lists
        run: python scripts/build_paper_list.py --check

      - name: Validate YAML syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/ISSUE_TEMPLATE/resource.yml"); YAML.load_file(".github/workflows/validate.yml"); YAML.load_file(".github/workflows/link-check.yml")'

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "*.md" "docs/**/*.md" "research/**/*.md"
